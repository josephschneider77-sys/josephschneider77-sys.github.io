<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/witch-cove/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="witch-cove-tip" content="de5b5a0794ea1d9dc855613b3397a111448eb971" />
    <title>Witch Cove — Measure the Tide Charm</title>
    <script type="module" crossorigin src="/witch-cove/assets/index-BzN_GhjB.js"></script>
    <link rel="stylesheet" crossorigin href="/witch-cove/assets/index-DgXo495Q.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <!-- Thin HUD — top meters never overlap the witch or each other -->
      <div id="hud">
        <div id="hud-top">
          <div id="xp-panel" class="hud-panel">
            <div id="xp-label">XP <span id="xp-value">0</span> / <span id="xp-max">14000</span></div>
            <div id="xp-bar"><div id="xp-fill"></div></div>
          </div>

          <div id="quest-line" class="hud-panel">
            <span class="quest-star" aria-hidden="true">✦</span>
            <span id="quest-text">Measure the Tide Charm</span>
            <span id="quest-progress">0 / 100</span>
          </div>

          <div id="hud-top-right">
            <div id="tide-gauge" class="hud-panel">
              <div class="tide-label">TIDE</div>
              <div id="tide-bar"><div id="tide-fill"></div></div>
              <div id="tide-level">LOW</div>
            </div>
            <div id="hp-panel" class="hud-panel" aria-live="polite">
              <div class="hp-label">HEARTS</div>
              <div id="hp-hearts" aria-label="Hearts 3 of 3">♥♥♥</div>
            </div>
          </div>
        </div>
      </div>

      <!-- One bottom lane: toast OR Measure OR hint — never stacked over the witch -->
      <div id="chrome-bottom">
        <button id="wardrobe-btn" type="button" title="Wardrobe">Wardrobe</button>
        <div id="chrome-bottom-center">
          <div id="toast" hidden></div>
          <button id="measure-btn" type="button" hidden>Measure</button>
          <div id="hint">Tap the ground to walk the hills · Approach a glow to Measure</div>
        </div>
        <div id="chrome-bottom-spacer" aria-hidden="true"></div>
      </div>

      <div id="measure-modal" hidden>
        <div class="modal-card">
          <h2 id="modal-title">Tide Charm</h2>
          <p id="modal-question"></p>
          <div id="modal-choices"></div>
          <div id="modal-spelling" hidden>
            <input id="spell-input" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="24" />
            <button id="spell-submit" type="button">Check</button>
          </div>
          <div class="modal-actions">
            <button id="skip-btn" type="button" class="btn-secondary">Skip</button>
          </div>
          <p id="modal-feedback" class="feedback" hidden></p>
        </div>
      </div>

      <div id="wardrobe-panel" hidden>
        <div class="wardrobe-card">
          <h2>Wardrobe</h2>
          <p class="wardrobe-note">Earned along the path · no shop</p>
          <h3>Cloak</h3>
          <div id="wardrobe-cloak" class="wardrobe-row"></div>
          <h3>Tunic</h3>
          <div id="wardrobe-clothes" class="wardrobe-row"></div>
          <h3>Hat</h3>
          <div id="wardrobe-hat" class="wardrobe-row"></div>
          <button id="wardrobe-close" type="button" class="btn-secondary">Close</button>
        </div>
      </div>

      <div id="win-overlay" hidden>
        <div class="win-card">
          <h1>Tide Charm Complete!</h1>
          <p>You measured the long hill path and every cove charm.</p>
          <p class="win-xp">+300 XP</p>
          <button id="win-wardrobe-btn" type="button" class="btn-secondary">Wardrobe</button>
          <button id="play-again-btn" type="button">Play again</button>
        </div>
      </div>
    </div>
  </body>
</html>
